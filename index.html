const W=Object.entries(D).flatMap(([lv,t])=>t.trim().split('\n').map(s=>{const[f,r]=s.split('|');return{f,r,lv}}));
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S={lv:'Все',dr:'mix',n:20};
function chips(id,items,key){const el=$(id);el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip'+(S[key]===v?' on':'');b.textContent=l;b.onclick=()=>{S[key]=v;menu()};el.appendChild(b)})}
function pool(){return S.lv==='Все'?W:W.filter(w=>w.lv===S.lv)}
function menu(){chips('lv',[['Все','A2–B2'],['A2','A2'],['B1','B1'],['B2','B2']],'lv');chips('dr',[['fr','FR → RU'],['ru','RU → FR'],['mix','Микс']],'dr');chips('nn',[[10,'10'],[20,'20'],[50,'50'],[9999,'Все']],'n');$('cnt').textContent='В выбранном наборе: '+pool().length+' слов и фраз'}
let deck,i,score,wrong,cur,done;
function start(list){deck=sh(list).slice(0,S.n);i=0;score=0;wrong=[];$('menu').classList.add('hide');$('end').classList.add('hide');$('game').classList.remove('hide');next()}
function next(){if(i>=deck.length)return finish();const w=deck[i];done=false;
let d=S.dr==='mix'?(Math.random()<.5?'fr':'ru'):S.dr;cur={w,d};
const src=d==='fr'?w.f:w.r,key=d==='fr'?'r':'f';
$('tg').textContent=(d==='fr'?'Французский → русский':'Русский → французский')+' · '+w.lv;
$('qt').textContent=src;$('sp').style.display=d==='fr'?'':'none';
const same=W.filter(x=>x.lv===w.lv&&x!==w);
const near=sh(same).sort((a,b)=>Math.abs(a[key].length-w[key].length)-Math.abs(b[key].length-w[key].length)).slice(0,12);
const wr=sh(near).slice(0,3);
const opts=sh([w,...wr]);
const box=$('op');box.innerHTML='';
opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o[key];b.onclick=()=>pick(b,o===w,opts,key);box.appendChild(b)});
$('nx').classList.add('hide');
$('pg').textContent=(i+1)+' / '+deck.length;$('sc').textContent='✓ '+score;$('pb').style.width=(i/deck.length*100)+'%'}
function pick(b,ok,opts,key){if(done)return;done=true;
[...$('op').children].forEach((el,k)=>{if(opts[k]===cur.w)el.classList.add('ok')});
if(ok)score++;else{b.classList.add('no');wrong.push(cur.w)}
$('sc').textContent='✓ '+score;$('nx').classList.remove('hide');$('nx').textContent=i+1>=deck.length?'Результат':'Дальше'}
function finish(){$('game').classList.add('hide');const e=$('end');e.classList.remove('hide');
const p=Math.round(score/deck.length*100);
e.innerHTML='<div class="big">'+p+'%</div><p style="text-align:center;color:var(--mu)">'+score+' из '+deck.length+' верно</p>'+
(wrong.length?'<h3>Повторить:</h3><ul>'+wrong.map(w=>'<li><b>'+w.f+'</b> — '+w.r+'</li>').join('')+'</ul><button class="btn" id="rw">Повторить ошибки</button>':'<p style="text-align:center">Без ошибок! 🎉</p>')+
'<button class="btn" id="mn" style="background:var(--card);color:var(--tx);border-color:var(--bd)">В меню</button>';
if(wrong.length)$('rw').onclick=()=>{const l=wrong.slice();S.n=9999;start(l)};
$('mn').onclick=()=>{e.classList.add('hide');$('menu').classList.remove('hide');S.n=20;menu()}}
$('go').onclick=()=>start(pool());
$('nx').onclick=()=>{i++;next()};
$('sp').onclick=()=>{try{const u=new SpeechSynthesisUtterance(cur.w.f);u.lang='fr-FR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
menu();
</script></body></html>
